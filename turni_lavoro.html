<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C2B39">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231C2B39'/%3E%3Ctext x='50' y='64' font-size='48' text-anchor='middle' fill='%23D98E3D' font-family='sans-serif'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E">
<title>Cartellino — Gestione Turni</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  --ink:#1C2B39;
  --ink-soft:#5C6B72;
  --paper:#EEF1EF;
  --paper-raised:#FFFFFF;
  --line:#CBD3CF;
  --amber:#D98E3D;
  --amber-soft:#F3DBB6;
  --teal:#3E7C6B;
  --teal-soft:#CFE3DC;
  --rust:#B85450;
  --rust-soft:#EBD1CF;
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  min-height:100vh;
  padding:24px 16px 64px;
}
.app{
  max-width:760px;
  margin:0 auto;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}
.brand h1{
  font-family:'Space Grotesk', sans-serif;
  font-size:1.5rem;
  font-weight:700;
  margin:0;
  letter-spacing:-0.01em;
}
.brand .tag{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  color:var(--ink-soft);
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:999px;
  padding:2px 10px;
}
.month-nav{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 8px;
}
.month-nav button{
  width:32px;height:32px;
  border-radius:50%;
  border:none;
  background:transparent;
  color:var(--ink);
  font-size:1.1rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.month-nav button:hover{background:var(--paper);}
.month-nav .label{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  min-width:150px;
  text-align:center;
  text-transform:capitalize;
}
.icon-btn{
  border:1px solid var(--line);
  background:var(--paper-raised);
  border-radius:10px;
  padding:9px 10px;
  cursor:pointer;
  font-family:'IBM Plex Sans', sans-serif;
  font-weight:500;
  font-size:0.82rem;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.icon-btn:hover{border-color:var(--ink-soft);}

.panel-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:16px;
}

/* legend */
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}
.chip{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid transparent;
  white-space:nowrap;
}
.calendar-note{
  font-size:0.72rem;
  color:var(--ink-soft);
  margin:0 0 14px 2px;
  display:flex;
  align-items:center;
}
.calendar-note .holiday-dot{margin-left:0; margin-right:6px;}

/* calendar */
.calendar-card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
}
.calendar-card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  gap:8px;
  flex-wrap:wrap;
}
.month-nav-inline{
  display:flex;
  align-items:center;
  gap:4px;
}
.month-nav-inline button{
  width:30px;height:30px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  font-size:1.05rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.month-nav-inline button:hover{border-color:var(--ink-soft);}
.month-nav-inline .calendar-card-title{
  min-width:126px;
  text-align:center;
  font-size:0.95rem;
  color:var(--ink);
}
.calendar-card-title{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:0.9rem;
  color:var(--ink-soft);
  text-transform:capitalize;
}
.edit-toggle{
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:999px;
  padding:6px 12px;
  font-size:0.75rem;
  font-family:'IBM Plex Sans', sans-serif;
  cursor:pointer;
  color:var(--ink-soft);
  white-space:nowrap;
}
.edit-toggle.active{
  background:var(--amber-soft);
  border-color:var(--amber);
  color:var(--ink);
  font-weight:600;
}
.weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-bottom:6px;
}
.weekdays span{
  text-align:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.76rem;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.05em;
}
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.day{
  min-height:100px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--paper);
  padding:4px;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.day.empty{border:none;background:transparent;min-height:0;}
.day .num{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.78rem;
  color:var(--ink-soft);
}
.day.today .num{color:var(--amber); font-weight:700;}
.day-shifts-fill{
  flex:1;
  display:flex;
  flex-direction:column;
  border-radius:5px;
  overflow:hidden;
  min-height:34px;
}
.shift-block{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-family:'IBM Plex Mono', monospace;
  font-weight:700;
  font-size:0.78rem;
  text-transform:uppercase;
  text-align:center;
  cursor:pointer;
  letter-spacing:0.01em;
  white-space:nowrap;
  overflow:hidden;
  padding:0 1px;
}
.day-shifts-fill.readonly .shift-block{cursor:default;}
.shift-block:not(:last-child){
  border-bottom:1px solid rgba(255,255,255,0.4);
}
.add-shift{
  width:100%;
  border:1px dashed var(--line);
  background:transparent;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.68rem;
  color:var(--ink-soft);
  border-radius:5px;
  padding:2px 2px;
  cursor:pointer;
}
.add-shift:focus{outline:2px solid var(--amber); outline-offset:1px;}
.holiday-dot{
  display:inline-block;
  width:5px;height:5px;
  border-radius:50%;
  background:var(--amber);
  margin-left:3px;
  vertical-align:middle;
}

@media (max-width:480px){
  body{padding:20px 8px 56px;}
  .days{gap:4px;}
  .day{padding:3px; min-height:92px;}
  .day .num{font-size:0.7rem;}
  .panel-buttons{gap:6px;}
  .icon-btn{font-size:0.72rem; padding:8px 4px;}
}

/* overlay / panel */
.overlay{
  position:fixed; inset:0;
  background:rgba(28,43,57,0.45);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:40px 16px;
  z-index:50;
  overflow-y:auto;
}
.panel{
  max-width:100%;
  overflow-x:hidden;
  background:var(--paper-raised);
  border-radius:14px;
  max-width:560px;
  width:100%;
  padding:24px;
  border:1px solid var(--line);
}
.panel h2{
  font-family:'Space Grotesk', sans-serif;
  margin-top:0;
  font-size:1.15rem;
}
.panel .close{
  float:right;
  border:none;
  background:transparent;
  font-size:1.3rem;
  cursor:pointer;
  color:var(--ink-soft);
}
.section-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--ink-soft);
  margin:20px 0 10px;
}
.pay-row{
  display:flex;
  gap:12px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.pay-row label{
  flex:1 1 140px;
  min-width:0;          /* permette al campo di restringersi invece di sfondare */
  font-size:0.8rem;
  color:var(--ink-soft);
  display:flex;
  flex-direction:column;
  gap:4px;
}
.pay-row input{
  width:100%;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 10px;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.9rem;
}
.pay-row input[type=date]{
  width:100%;
  max-width:100%;
  min-width:0;
}
.type-row{
  display:grid;
  grid-template-columns:28px 60px 1fr 70px 24px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}
.type-row input[type=color]{
  width:28px;height:28px;padding:0;border:none;border-radius:6px;cursor:pointer;background:none;
}
.type-row input[type=text],.type-row input[type=number]{
  border:1px solid var(--line);
  border-radius:8px;
  padding:6px 8px;
  font-size:0.85rem;
  font-family:'IBM Plex Sans', sans-serif;
  width:100%;
}
.type-row .del{
  border:none;background:transparent;color:var(--rust);cursor:pointer;font-size:1rem;
}
.add-type{
  border:1px dashed var(--line);
  background:transparent;
  border-radius:8px;
  padding:8px;
  width:100%;
  cursor:pointer;
  color:var(--ink-soft);
  font-size:0.82rem;
  margin-top:4px;
}
.panel-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:22px;
}
.btn-primary{
  background:var(--ink);
  color:var(--paper);
  border:none;
  border-radius:8px;
  padding:9px 18px;
  cursor:pointer;
  font-weight:500;
  font-family:'IBM Plex Sans', sans-serif;
}

/* stats / earnings rows */
.special-row{
  display:flex;
  justify-content:space-between;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.85rem;
  padding:5px 0;
}
.special-row-sep{
  border-top:1px dashed var(--line);
  margin-top:6px;
  padding-top:10px;
}
.special-group-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.66rem;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--amber);
}
.net-input-light{
  width:100%;
  font-family:'IBM Plex Mono', monospace;
  font-size:1.1rem;
  font-weight:600;
  color:var(--ink);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 10px;
}

/* multiplier blocks (Guadagni) */
.mult-block{
  margin-bottom:18px;
  padding-bottom:14px;
  border-bottom:1px dashed var(--line);
}
.mult-block:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
.mult-header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:none;
  border:none;
  padding:0;
  cursor:pointer;
  text-align:left;
  font-family:inherit;
}
.mult-title{
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size:1.02rem;
  color:var(--ink);
  margin:0;
}
.mult-header-right{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.85rem;
  color:var(--ink);
  white-space:nowrap;
}
.chevron{color:var(--ink-soft); font-size:0.68rem;}
.mult-body{margin-top:10px;}
.mult-row{
  display:flex;
  gap:8px;
  margin:6px 0 6px;
}
.mult-input{
  flex:1;
  border:1px solid var(--line);
  border-radius:8px;
  padding:7px 9px;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.85rem;
}
.mult-suggestions-inline{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
.mult-chip{
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:6px;
  padding:4px 7px;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.68rem;
  cursor:pointer;
  color:var(--ink-soft);
}
.mult-chip:hover{border-color:var(--amber); color:var(--amber);}
.suggestions-toggle{
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:6px;
  padding:4px 9px;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.7rem;
  color:var(--ink-soft);
  cursor:pointer;
  margin-bottom:6px;
}
.suggestions-list{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-bottom:10px;
}
.suggestion-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:6px;
  padding:7px 10px;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.78rem;
  color:var(--ink);
  cursor:pointer;
  width:100%;
  text-align:left;
}
.suggestion-item:hover{border-color:var(--amber);}
.suggestion-value{font-weight:700;}
.suggestion-label{color:var(--ink-soft); text-transform:capitalize;}
.mult-toggle{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:0.76rem;
  color:var(--ink-soft);
  margin:8px 0 4px;
}
.mult-toggle input{width:14px;height:14px;cursor:pointer;}
.mult-total{
  display:flex;
  justify-content:space-between;
  font-family:'IBM Plex Mono', monospace;
  font-weight:700;
  font-size:0.92rem;
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--line);
}

.year-bars{
  display:flex;
  align-items:flex-end;
  gap:4px;
  height:120px;
}
.year-bar-col{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
  height:100%;
}
.year-bar{
  width:70%;
  background:var(--teal);
  border-radius:4px 4px 0 0;
  min-height:3px;
  transition:height 0.2s;
}
.year-bar-col.current .year-bar{background:var(--amber);}
.year-bar-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.6rem;
  color:var(--ink-soft);
}
.year-bar-col.current .year-bar-label{color:var(--amber); font-weight:700;}

.backup-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  background:var(--amber-soft);
  border:1px solid var(--amber);
  border-radius:10px;
  padding:10px 14px;
  margin-bottom:16px;
  font-size:0.82rem;
  color:var(--ink);
}
.backup-banner-actions{display:flex; gap:8px; flex-shrink:0;}
.backup-banner-actions button{
  border:none;
  border-radius:7px;
  padding:6px 12px;
  font-size:0.78rem;
  font-family:'IBM Plex Sans', sans-serif;
  cursor:pointer;
  font-weight:500;
}
.backup-banner-actions .bb-primary{background:var(--ink); color:var(--paper);}
.backup-banner-actions .bb-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--ink-soft);}

.loading{
  text-align:center;
  padding:40px;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size:0.85rem;
}

.login-screen{
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.login-card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:14px;
  padding:32px 26px;
  max-width:360px;
  width:100%;
}
.login-title{
  font-family:'Space Grotesk', sans-serif;
  font-size:1.6rem;
  margin:0 0 4px;
  text-align:center;
}
.login-sub{
  text-align:center;
  color:var(--ink-soft);
  font-size:0.85rem;
  margin:0 0 20px;
}
.login-field{
  display:block;
  font-size:0.8rem;
  color:var(--ink-soft);
  margin-bottom:12px;
}
.login-field input{
  display:block;
  width:100%;
  margin-top:4px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 11px;
  font-family:'IBM Plex Sans', sans-serif;
  font-size:0.9rem;
  color:var(--ink);
  background:var(--paper);
}
.login-note{
  font-size:0.68rem;
  color:var(--ink-soft);
  text-align:center;
  margin-top:16px;
}

.structure-tabs{
  display:flex;
  gap:6px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.structure-tab{
  border:1px solid var(--line);
  background:var(--paper-raised);
  border-radius:999px;
  padding:7px 14px;
  font-family:'IBM Plex Sans', sans-serif;
  font-size:0.82rem;
  color:var(--ink-soft);
  cursor:pointer;
}
.structure-tab.active{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
  font-weight:600;
}
.dept-filter{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--line);
}
.dept-chip{
  display:flex;
  align-items:center;
  gap:5px;
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:999px;
  padding:5px 11px;
  font-size:0.76rem;
  font-family:'IBM Plex Sans', sans-serif;
  color:var(--ink-soft);
  cursor:pointer;
}
.dept-chip.active{
  border-color:var(--amber);
  color:var(--ink);
  font-weight:600;
}
.dept-dot{
  display:inline-block;
  width:7px;height:7px;
  border-radius:50%;
  flex-shrink:0;
}
.shift-block .dept-dot{
  margin-left:4px;
  width:9px;height:9px;
  border:2px solid rgba(255,255,255,0.85);
  box-shadow:0 0 0 1px rgba(0,0,0,0.18);
}
.struct-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 0;
  border-bottom:1px dashed var(--line);
  font-size:0.85rem;
}
.struct-name em{color:var(--amber); font-style:normal; font-size:0.72rem;}
.mini-btn{
  border:1px solid var(--line);
  background:transparent;
  border-radius:6px;
  padding:3px 8px;
  font-size:0.7rem;
  cursor:pointer;
  color:var(--ink-soft);
  margin-left:4px;
}
.mini-btn.danger{color:var(--rust); border-color:var(--rust);}
.dept-row{
  display:grid;
  grid-template-columns:28px 1fr 24px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}
.dept-row input[type=color]{
  width:28px;height:28px;padding:0;border:none;border-radius:6px;cursor:pointer;background:none;
}
.dept-row input[type=text]{
  border:1px solid var(--line);
  border-radius:8px;
  padding:6px 8px;
  font-size:0.85rem;
  font-family:'IBM Plex Sans', sans-serif;
  width:100%;
}

.color-picker-wrap{position:relative;}
.color-swatch-btn{
  width:28px;height:28px;
  border-radius:6px;
  border:2px solid var(--line);
  cursor:pointer;
  padding:0;
}
.color-popover{
  position:absolute;
  top:34px; left:0;
  z-index:20;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  box-shadow:0 6px 20px rgba(0,0,0,0.18);
  width:186px;
}
.color-popover-title{
  font-size:0.68rem;
  color:var(--ink-soft);
  margin-bottom:7px;
}
.color-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}
.color-cell{
  width:100%;
  aspect-ratio:1/1;
  border-radius:6px;
  border:2px solid transparent;
  cursor:pointer;
  padding:0;
}
.color-cell.selected{border-color:var(--ink); outline:2px solid var(--paper-raised);}

function getEasterDate(year){
  const a = year % 19;
  const b = Math.floor(year/100);
  const c = year % 100;
  const d = Math.floor(b/4);
  const e = b % 4;
  const f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3);
  const h = (19*a+b-d-g+15)%30;
  const i = Math.floor(c/4);
  const k = c%4;
  const l = (32+2*e+2*i-h-k)%7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day = ((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
const holidaySetCache = {};
function getHolidaySet(year){
  if(holidaySetCache[year]) return holidaySetCache[year];

  add(11,8,'Immacolata Concezione');
  add(11,25,'Natale');
  add(11,26,'Santo Stefano');
  const easter = getEasterDate(year);
  const easterMonday = new Date(easter.getFullYear(), easter.getMonth(), easter.getDate()+1);
  set[`${easterMonday.getMonth()}-${easterMonday.getDate()}`] = 'Pasquetta';
  holidaySetCache[year] = set;
  return set;
}

function buildGeneralDayMap(y,m){
  const map = {};
  structures.forEach(s=>{
    let sTypes = DEFAULT_TYPES, sDepts = [];
    try{
      const t = localStorage.getItem(typesKey(s.id));
      if(t) sTypes = JSON.parse(t);
    }catch(e){}
    try{
      const d = localStorage.getItem(deptsKey(s.id));
      if(d) sDepts = JSON.parse(d);
    }catch(e){}
    let sMonth = null;
    try{
      const raw = localStorage.getItem(monthKeyFor(s.id, y, m));
      if(raw) sMonth = normalizeMonthData(JSON.parse(raw));
    }catch(e){}
    if(!sMonth) return;
    Object.entries(sMonth.shifts).forEach(([day,list])=>{
      list.forEach(entry=>{
        const t = sTypes.find(x=>x.id===entry.t);
        if(!t) return;
        const dp = sDepts.find(x=>x.id===entry.d);
        if(!map[day]) map[day] = [];
        map[day].push({
          code: t.code, color: t.color, label: t.label,
          structureName: s.name,
          deptName: dp?dp.name:null, deptColor: dp?dp.color:null
        });
      });
    });
  });
  return map;
}

function normalizeShiftEntry(v){
  if(typeof v === 'string') return {t:v, d:null};
  if(v && typeof v === 'object') return {t:v.t, d:(v.d===undefined?null:v.d)};
  return {t:null, d:null};
}

function normalizeMonthData(parsed){
  if(parsed && typeof parsed==='object' && parsed.shifts){
    const shifts = {};
    Object.entries(parsed.shifts).forEach(([d,v])=>{ shifts[d] = (Array.isArray(v)?v:[v]).map(normalizeShiftEntry); });
    const extra = {};
    if(parsed.extra) Object.entries(parsed.extra).forEach(([d,v])=>{ extra[d] = Number(v); });
    return {shifts, net: (parsed.net===undefined?null:parsed.net), extra, overtimeThreshold: (parsed.overtimeThreshold===undefined?null:parsed.overtimeThreshold), taxes: (parsed.taxes===undefined?null:parsed.taxes)};
  }
  if(parsed && typeof parsed==='object'){
    const shifts = {};
    Object.entries(parsed).forEach(([d,v])=>{ shifts[d] = (Array.isArray(v)?v:[v]).map(normalizeShiftEntry); });
    return {shifts, net:null, extra:{}, overtimeThreshold:null, taxes:null};
  }
  return {shifts:{}, net:null, extra:{}, overtimeThreshold:null, taxes:null};
}

function exportBackup(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k===STORAGE_STRUCTURES_KEY || k.startsWith('shift-types:') || k.startsWith('pay-config:') || k.startsWith('departments:') || k.startsWith('month:')){
      data[k] = localStorage.getItem(k);
    }
  }
  const jsonStr = JSON.stringify(data, null, 2);

  if(window.ExportBackup){
    // Dentro l'app Flutter: manda il contenuto al lato nativo, che lo condivide/salva.
    const b64 = btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g, (m,p1)=>String.fromCharCode('0x'+p1)));
    window.ExportBackup.postMessage(b64);
  } else {
    // Browser normale: scarica come file, come sempre.
    const blob = new Blob([jsonStr], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cartellino-backup.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  localStorage.setItem(STORAGE_LASTBACKUP_KEY, new Date().toISOString());
  localStorage.removeItem(STORAGE_SNOOZE_KEY);
  render();
}
window.exportBackup = exportBackup;

function daysSince(dateStr){
  return (Date.now() - new Date(dateStr).getTime()) / (1000*60*60*24);
}
function shouldShowBackupReminder(){
  const snooze = localStorage.getItem(STORAGE_SNOOZE_KEY);
  if(snooze && new Date(snooze).getTime() > Date.now()) return false;
  const last = localStorage.getItem(STORAGE_LASTBACKUP_KEY) || localStorage.getItem(STORAGE_FIRSTUSE_KEY);
  if(!last) return false;
  return daysSince(last) >= BACKUP_REMINDER_DAYS;
}

  const d = new Date(Date.now() + SNOOZE_DAYS*24*60*60*1000);

function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const data = JSON.parse(e.target.result);
      Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,v));
      await loadSettings();
      await loadMonth(viewY, viewM);
      alert('Backup importato con successo.');
      closePanel();
      render();
    }catch(err){
      alert('File di backup non valido.');
    }
  };
  reader.readAsText(file);
}
window.importBackup = importBackup;

function typeById(id){ return types.find(t=>t.id===id); }

function calcMultiplied(qty, cfg){
  if(!cfg) return 0;
  const m1 = Number(cfg.m1)||0;
  let total = qty * m1;
  if(cfg.useM2){
    const m2 = Number(cfg.m2)||0;
    total += qty * m2;
  }
  return total;
}

function computeSummary(){
  let normalHours = 0;
  let holidayHours = 0, sundayHours = 0;
  let vacationDays = new Set();
  let nightDays = new Set();

  Object.entries(monthData.shifts).forEach(([day,list])=>{
    const d = Number(day);
    const isSunday = new Date(viewY, viewM, d).getDay()===0;
    const holidayName = getHolidayName(viewY, viewM, d);
    const isHoliday = !!holidayName;

    list.forEach(entry=>{
      const t = typeById(entry.t);
      if(!t) return;
      const hrs = Number(t.hours)||0;
      const code = (t.code||'').trim().toUpperCase();

      if(code==='N') nightDays.add(day);

      if(code==='F'){
        vacationDays.add(day);
        return; // solo giorno, non ore/soldi
      }
      if(isHoliday){ holidayHours += hrs; return; }
      if(isSunday){ sundayHours += hrs; return; }
      normalHours += hrs;
    });
  });

  const ordinaryHours = normalHours + sundayHours; // usate per il lordo stimato
  const totalHours = normalHours + sundayHours + holidayHours; // tutte le ore lavorate
  const gross = ordinaryHours * (Number(pay.hourlyRate)||0);

  return {
    totalHours, ordinaryHours, gross,
    holidayHours, sundayHours,
    vacationDays: vacationDays.size, nightDays: nightDays.size,
    net: monthData.net
  };
}

function fmtEuro(n){
  if(n===null || n===undefined || n==='') return '—';
  return Number(n).toLocaleString('it-IT', {style:'currency', currency:'EUR'});
}
function fmtHours(n){
  return Number(n).toLocaleString('it-IT', {maximumFractionDigits:1});
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function firstWeekdayMon0(y,m){
  const d = new Date(y,m,1).getDay();
  return (d+6)%7;
}

function hexToSoftBg(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
  return `rgba(${r},${g},${b},0.18)`;
}


// Calcola ore lavorate e totale (tasse gia' sottratte) per un mese qualunque
// della struttura attiva, senza modificare quello che si sta guardando.
function computeMonthStats(y, m){
  let raw = null;
  try{ raw = localStorage.getItem(monthKeyFor(activeStructureId, y, m)); }catch(e){}
  if(!raw) return {hours:0, total:0, net:null, hasData:false};
  let md;
  try{ md = normalizeMonthData(JSON.parse(raw)); }catch(e){ return {hours:0,total:0,net:null,hasData:false}; }

  let normalH=0, holH=0, sunH=0, vacDays=new Set(), nightDays=new Set();
  Object.entries(md.shifts).forEach(([day,list])=>{
    const d = Number(day);
    const isSun = new Date(y,m,d).getDay()===0;
    const isHol = !!getHolidayName(y,m,d);
    list.forEach(entry=>{
      const t = typeById(entry.t);
      if(!t) return;
      const hrs = Number(t.hours)||0;
      const code = (t.code||'').trim().toUpperCase();
      if(code==='N') nightDays.add(day);
      if(code==='F'){ vacDays.add(day); return; }
      if(isHol) holH += hrs;
      else if(isSun) sunH += hrs;
      else normalH += hrs;
    });
  });

  const ordinary = normalH + sunH;
  const hours = normalH + sunH + holH;
  const gross = ordinary * (Number(pay.hourlyRate)||0);
  const otH = calcOvertimeHours(md.overtimeThreshold, ordinary);
  const otAmount = calcMultiplied(otH, pay.multipliers.overtime);
  const otBase = otH * (Number(pay.hourlyRate)||0);
  const grand = gross - otBase + otAmount
    + calcMultiplied(holH, pay.multipliers.holiday)
    + calcMultiplied(sunH, pay.multipliers.sunday)
    + calcMultiplied(nightDays.size, pay.multipliers.night)
    + calcMultiplied(vacDays.size, pay.multipliers.vacation);
  const pct = (pay.taxPercent===null||pay.taxPercent===undefined) ? 18 : Number(pay.taxPercent);
  const total = grand * (1 - pct/100);
  return {hours, total, net: (md.net===undefined?null:md.net), hasData: hours>0 || grand>0 || md.net!=null};
}

// Ferie maturate dall'inizio del lavoro meno quelle gia' godute.
function computeVacationBalance(){
  const rate = Number(pay.vacationPerMonth)||0;
  if(!pay.startDate || rate<=0) return null;
  const start = new Date(pay.startDate);
  if(isNaN(start.getTime())) return null;

  const now = new Date();
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  if(now.getDate() >= start.getDate()) months += 1;   // mese in corso gia' maturato
  months = Math.max(0, months);
  const accrued = months * rate;

  // conta i giorni di ferie inseriti dal mese di inizio a oggi
  let used = 0;
  let y = start.getFullYear(), m = start.getMonth();
  while(y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())){
    try{
      const raw = localStorage.getItem(monthKeyFor(activeStructureId, y, m));
      if(raw){
        const md = normalizeMonthData(JSON.parse(raw));
        const days = new Set();
        Object.entries(md.shifts).forEach(([day,list])=>{
          list.forEach(entry=>{
            const t = typeById(entry.t);
            if(t && (t.code||'').trim().toUpperCase()==='F') days.add(day);
          });
        });
        used += days.size;
      }
    }catch(e){}
    m++; if(m>11){ m=0; y++; }
  }
  return {months, accrued, used, left: accrued - used};
}

// Anni per cui esistono dati salvati nella struttura attiva.
function getYearsWithData(){
  const years = new Set();
  const prefix = `month:${activeStructureId}:`;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(prefix)){
        const y = Number(k.substring(prefix.length).split('-')[0]);
        if(!isNaN(y)) years.add(y);
      }
    }
  }catch(e){}
  years.add(viewY);
  return [...years].sort((a,b)=>b-a);   // dal piu' recente
}

function renderYearChart(year){
  const data = [];
  for(let m=0;m<12;m++){ data.push(computeMonthStats(year,m)); }
  const netOf = (d)=> (d.net===null||d.net===undefined) ? 0 : Number(d.net);
  const maxH = Math.max(1, ...data.map(d=>d.hours));
  const maxT = Math.max(1, ...data.map(d=>netOf(d)));

  const totHours = data.reduce((s,d)=>s+d.hours,0);
  const totMoney = data.reduce((s,d)=>s+netOf(d),0);

  const cols = data.map((d,m)=>{
    const hH = d.hours>0 ? Math.max(3, Math.round((d.hours/maxH)*100)) : 0;
    const nv = netOf(d);
    const hT = nv>0 ? Math.max(3, Math.round((nv/maxT)*100)) : 0;
    const cur = m===viewM ? 'current' : '';
    return `
      <div class="chart-col ${cur}" title="${ITALIAN_MONTHS_SHORT[m]} — ${fmtHours(d.hours)} h · ${nv>0?fmtEuro(nv):'netto non inserito'}">
        <div class="chart-pair">
          <div class="chart-bar hours" style="height:${hH}%;"></div>
          <div class="chart-bar money" style="height:${hT}%;"></div>
        </div>
        <span class="chart-label">${ITALIAN_MONTHS_SHORT[m]}</span>
      </div>`;
  }).join('');

  return {
    chart: `
      <div class="chart-legend">
        <span><i class="sw hours"></i> ore lavorate</span>
        <span><i class="sw money"></i> netto inserito</span>
      </div>
      <div class="chart-area">${cols}</div>`,
    summary: `
      <div class="chart-totals">
        <div><span>Ore nell'anno</span><b>${fmtHours(totHours)} h</b></div>
        <div><span>Netto nell'anno</span><b>${fmtEuro(totMoney)}</b></div>
      </div>
      <div class="section-label" style="margin-top:18px;">Dettaglio mensile</div>
      <div class="month-table">
        ${data.map((d,m)=> d.hasData ? `
          <div class="month-row ${m===viewM?'current':''}">
            <span>${ITALIAN_MONTHS[m]}</span>
            <span>${fmtHours(d.hours)} h</span>
            <span>${(d.net===null||d.net===undefined)?'—':fmtEuro(d.net)}</span>
          </div>` : '').join('') || `<div class="calendar-note">nessun dato per il ${year}</div>`}
      </div>`
  };
}

function renderAnnualNetChart(){
  const year = viewY;
  const nets = [];
  for(let m=0;m<12;m++){ nets.push(getStoredNet(year,m)); }
  const present = nets.filter(v=>v!==null && v!==undefined);
  const maxNet = Math.max(1, ...present.map(Number));
  const bars = nets.map((v,m)=>{
    const hasVal = v!==null && v!==undefined;
    const h = hasVal ? Math.max(4, Math.round((Number(v)/maxNet)*100)) : 2;
    const isCur = m===viewM;
    return `<div class="year-bar-col ${isCur?'current':''}" title="${ITALIAN_MONTHS_SHORT[m]}: ${hasVal?fmtEuro(v):'non inserito'}">
      <div class="year-bar" style="height:${h}%;"></div>
      <span class="year-bar-label">${ITALIAN_MONTHS_SHORT[m]}</span>
    </div>`;
  }).join('');
  return `<div class="year-bars">${bars}</div>`;
}
function getStoredNet(y,m){
  try{
    const r = localStorage.getItem(monthKey(y,m));
    if(!r) return null;
    const p = normalizeMonthData(JSON.parse(r));
    return p.net===undefined?null:p.net;
  }catch(e){ return null; }
}

function calcOvertimeHours(threshold, ordinaryHours){
  if(threshold===null || threshold===undefined || threshold==='') return 0;
  return Math.max(0, ordinaryHours - Number(threshold));
}

function renderEarningsPanel(summary){
  const threshold = monthData.overtimeThreshold;
  const overtimeHours = calcOvertimeHours(threshold, summary.ordinaryHours);
  const overtimeAmount = calcMultiplied(overtimeHours, pay.multipliers.overtime);
  const overtimeBaseAlreadyInGross = overtimeHours * (Number(pay.hourlyRate)||0);
  const holidayAmount = calcMultiplied(summary.holidayHours, pay.multipliers.holiday);
  const sundayAmount = calcMultiplied(summary.sundayHours, pay.multipliers.sunday);
  const nightAmount = calcMultiplied(summary.nightDays, pay.multipliers.night);
  const vacationAmount = calcMultiplied(summary.vacationDays, pay.multipliers.vacation);
  // Le ore di straordinario sono gia' incluse (a tariffa normale) dentro "gross":
  // le sottraiamo una volta a tariffa normale e le riaggiungiamo alla tariffa straordinaria,
  // cosi' non vengono pagate due volte.
  const grandTotal = summary.gross - overtimeBaseAlreadyInGross + overtimeAmount + holidayAmount + sundayAmount + nightAmount + vacationAmount;

  const taxPct = (pay.taxPercent===null||pay.taxPercent===undefined) ? 18 : Number(pay.taxPercent);
  const taxAmount = grandTotal * (taxPct/100);
  const totalAfterTaxes = grandTotal - taxAmount;

  return `
    <h2>Guadagni — ${ITALIAN_MONTHS[viewM]} ${viewY}</h2>
    <div class="section-label">Riepilogo mese</div>
    <div class="special-row"><span>Ore totali</span><span>${fmtHours(summary.totalHours)} h</span></div>
    <div class="special-row"><span>Lordo (ore ordinarie)</span><span>${fmtEuro(summary.gross)}</span></div>
    <div class="special-row special-row-sep" style="color:var(--ink-soft); font-size:0.72rem;">+ straordinari / festivi / domenicali / notte / ferie (dettaglio sotto)</div>
    <div class="mult-total" style="font-size:1rem; margin-top:10px; border-top:none; padding-top:0;">
      <span>Totale mese stimato</span>
      <span>${fmtEuro(grandTotal)}</span>
    </div>
    <div class="special-row" style="color:var(--rust);">
      <span>Tasse (${taxPct}%) <button type="button" class="mini-btn" onclick="changeTaxPercent()">modifica</button></span>
      <span>− ${fmtEuro(taxAmount)}</span>
    </div>
    <div class="mult-total" style="font-size:1rem;">
      <span>Stipendio netto stimato</span>
      <span>${fmtEuro(totalAfterTaxes)}</span>
    </div>
    <div style="margin:16px 0 20px;">
      <div class="section-label" style="margin:0 0 6px;">Netto reale del mese</div>
      <input type="number" step="0.01" class="net-input-light" id="netInput" placeholder="Inserisci l'importo" value="${summary.net===null||summary.net===undefined?'':summary.net}" onchange="onNetChange(event)">
    </div>
    ${renderOvertimeBlock(summary)}
    ${renderMultBlock('holiday','Festivi', summary.holidayHours, 'Ore', 'h')}
    ${renderMultBlock('sunday','Domenicali', summary.sundayHours, 'Ore', 'h')}
    ${renderMultBlock('night','Notte', summary.nightDays, 'Giorni', 'gg')}
    ${renderMultBlock('vacation','Ferie', summary.vacationDays, 'Giorni', 'gg')}
  `;
}

window.onLoginSubmit = async function(e){
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if(!email || !pass) return;

  if(window.FB && window.FB.enabled){
    const errBox = document.getElementById('loginError');
    try{
      await window.FB.signIn(email, pass);
    }catch(err){
      // se l'utente non esiste, prova a registrarlo
      try{
        await window.FB.signUp(email, pass);
      }catch(err2){
        // mostra sempre il motivo reale, cosi' i problemi si vedono
        if(errBox){
          errBox.innerHTML = `Accesso online non riuscito.<br><small>${err2.code || ''} ${err2.message || ''}</small>`;
        }
        return;
      }
    }
    authUser = {email, uid: window.FB.auth.currentUser?.uid || null};
  } else {
    authUser = {email};
  }
  try{ localStorage.setItem(STORAGE_AUTH_KEY, JSON.stringify(authUser)); }catch(err){}
  loadGroup();
  render();
  startRequestsListener();
};
window.localOnlyLogin = function(){
  const email = document.getElementById('loginEmail').value.trim() || 'locale';
  authUser = {email};
  try{ localStorage.setItem(STORAGE_AUTH_KEY, JSON.stringify(authUser)); }catch(e){}
  loadGroup();
  render();
};

window.logout = async function(){
  stopRequestsListener();

    try{ await window.FB.signOut(); }catch(e){}
  }
  authUser = null;
  try{ localStorage.removeItem(STORAGE_AUTH_KEY); }catch(err){}
  render();
};

  for(let d=1; d<=nDays; d++){

    const assigned = all.map((e,i)=>({e,i})).filter(({e})=> deptFilter===null || e.d===deptFilter);
    const longestCode = Math.max(0, ...assigned.map(({e})=>{ const t=typeById(e.t); return t?t.code.length:0; }));
    const blockFontSize = assigned.length>=3 ? '0.96rem' : (assigned.length===2 && longestCode>1) ? '1.06rem' : '1.25rem';
    const blocks = assigned.map(({e,i})=>{

      if(!t) return '';

      const titleAttr = editMode ? `title="Rimuovi ${t.label}${dept?' — '+dept.name:''}"` : `title="${t.label}${dept?' — '+dept.name:''}"`;

// Controlla se lo stesso turno e' gia' inserito in un'altra struttura in quel giorno.
function findConflictInOtherStructures(day, typeId){
  const t = typeById(typeId);
  if(!t) return null;
  const code = (t.code||'').trim().toUpperCase();
  for(const s of structures){
    if(s.id === activeStructureId) continue;
    try{
      const raw = localStorage.getItem(monthKeyFor(s.id, viewY, viewM));
      if(!raw) continue;
      const other = normalizeMonthData(JSON.parse(raw));
      const list = other.shifts[day] || [];
      // i tipi turno sono definiti per struttura: confrontiamo per codice, non per id
      let otherTypes = [];
      try{
        const ot = localStorage.getItem(typesKey(s.id));
        otherTypes = ot ? JSON.parse(ot) : DEFAULT_TYPES;
      }catch(err){ otherTypes = DEFAULT_TYPES; }
      const match = list.some(entry=>{
        const ot = otherTypes.find(x=>x.id===entry.t);
        return ot && (ot.code||'').trim().toUpperCase() === code;
      });
      if(match) return {structureName: s.name, code};
    }catch(err){}
  }
  return null;
}

// Aggiorna solo il contenuto del pannello aperto: il contenitore che scorre
// resta lo stesso, quindi la posizione di scorrimento non si perde.
function renderPanelBody(){
  const panel = document.querySelector('.panel');
  if(!panel || !activePanel){ render(); return; }
  const summary = activeStructureId === GENERAL_ID ? null : computeSummary();
  panel.innerHTML = `
    <button class="close" onclick="closePanel()">×</button>
    ${activePanel==='settings' ? renderSettingsPanel() : ''}
    ${activePanel==='stats' ? renderStatsPanel() : ''}
    ${activePanel==='earnings' ? renderEarningsPanel(summary) : ''}
    ${activePanel==='swap' ? renderSwapPanel() : ''}
  `;
}

window.addShift = async function(e){
  const day = Number(e.target.dataset.day);
  const val = e.target.value;
  if(!val) return;

  const conflict = findConflictInOtherStructures(day, val);
  if(conflict){
    const ok = confirm(`Attenzione: il giorno ${day} hai gia' un turno "${conflict.code}" in "${conflict.structureName}".\n\nControlla l'altra struttura prima di continuare.\n\nVuoi aggiungerlo lo stesso?`);
    if(!ok){ render(); return; }
  }

  if(!monthData.shifts[day]) monthData.shifts[day] = [];
  monthData.shifts[day].push({t:val, d:deptFilter});
  await saveMonth(viewY, viewM);
  render();
};

window.removeShift = async function(day, idx){
  if(!editMode) return;
  if(monthData.shifts[day]){
    monthData.shifts[day].splice(idx,1);
    if(monthData.shifts[day].length===0) delete monthData.shifts[day];
  }
  await saveMonth(viewY, viewM);
  render();
};

window.removeStructure = async function(sid){
  if(structures.length<=1){ alert('Deve restare almeno una struttura.'); return; }
  const s = structures.find(x=>x.id===sid);
  if(!s) return;
  if(!confirm(`Eliminare "${s.name}" e tutti i suoi turni? L'operazione non si puo' annullare.`)) return;
  try{
    localStorage.removeItem(typesKey(sid));
    localStorage.removeItem(payKey(sid));
    localStorage.removeItem(deptsKey(sid));
    const toRemove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(`month:${sid}:`)) toRemove.push(k);
    }
    toRemove.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  structures = structures.filter(x=>x.id!==sid);
  saveStructures();
  activeStructureId = structures[0].id;
  deptFilter = null;
  await loadSettings();
  await loadMonth(viewY, viewM);
  render();
};

  render();
};

// Usata dall'app Flutter per sapere i turni di domani e programmare la notifica.
window.getTomorrowShifts = function(){
  const t = new Date();
  t.setDate(t.getDate()+1);
  const y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
  const out = [];
  try{
    const sList = JSON.parse(localStorage.getItem(STORAGE_STRUCTURES_KEY) || '[]');
    sList.forEach(s=>{
      let sTypes = DEFAULT_TYPES;
      try{ const tt = localStorage.getItem(`shift-types:${s.id}`); if(tt) sTypes = JSON.parse(tt); }catch(e){}
      let raw = localStorage.getItem(`month:${s.id}:${y}-${String(m+1).padStart(2,'0')}`);
      if(!raw) return;
      const md = normalizeMonthData(JSON.parse(raw));
      (md.shifts[d]||[]).forEach(entry=>{
        const ty = sTypes.find(x=>x.id===entry.t);
        if(ty) out.push(sList.length>1 ? `${ty.label} (${s.name})` : ty.label);
      });
    });
  }catch(e){}
  return JSON.stringify(out);
};


// ==================== SCAMBIO TURNI (online) ====================

function loadGroup(){
  try{
    const g = JSON.parse(localStorage.getItem(STORAGE_GROUP_KEY) || 'null');
    if(g){ groupCode = g.code || null; displayName = g.name || ''; }
  }catch(e){ groupCode = null; displayName = ''; }
}
function saveGroup(){
  try{ localStorage.setItem(STORAGE_GROUP_KEY, JSON.stringify({code:groupCode, name:displayName})); }catch(e){}
}

function onlineReady(){
  return window.FB && window.FB.enabled && authUser && authUser.uid && groupCode;
}

function stopRequestsListener(){
  if(requestsUnsub){ try{ requestsUnsub(); }catch(e){} requestsUnsub = null; }
  openRequests = [];
}

function startRequestsListener(){
  stopRequestsListener();
  if(!onlineReady()) return;
  const FB = window.FB;
  try{
    const q = FB.query(
      FB.collection(FB.db, 'groups', groupCode, 'requests'),
      FB.orderBy('date')
    );
    requestsUnsub = FB.onSnapshot(q, (snap)=>{
      openRequests = [];
      snap.forEach(d=>openRequests.push({id:d.id, ...d.data()}));
      if(activePanel === 'swap') renderPanelBody();
    }, (err)=>console.error('Ascolto richieste non riuscito', err));
  }catch(e){ console.error(e); }
}

window.joinGroup = async function(){
  const code = prompt('Codice del gruppo di lavoro (chiedilo a un collega, oppure inventane uno nuovo per crearlo):');
  if(!code || !code.trim()) return;
  const name = prompt('Come vuoi farti chiamare dai colleghi?', displayName || (authUser?authUser.email.split('@')[0]:''));
  if(!name || !name.trim()) return;
  groupCode = code.trim().toLowerCase();
  displayName = name.trim();
  saveGroup();
  startRequestsListener();
  renderPanelBody();
};

window.leaveGroup = function(){
  if(!confirm('Uscire dal gruppo? Le tue richieste gia inviate restano visibili ai colleghi.')) return;
  stopRequestsListener();
  groupCode = null;
  saveGroup();
  renderPanelBody();
};

window.createSwapRequest = async function(){
  if(!onlineReady()){ alert('Devi prima entrare in un gruppo.'); return; }
  const dateStr = document.getElementById('swapDate')?.value;
  const shift = document.getElementById('swapShift')?.value.trim();
  const note = document.getElementById('swapNote')?.value.trim();
  if(!dateStr){ alert('Scegli il giorno del turno.'); return; }
  if(!shift){ alert('Indica quale turno (es. P, M, N).'); return; }
  onlineBusy = true; renderPanelBody();
  try{
    const FB = window.FB;
    await FB.addDoc(FB.collection(FB.db, 'groups', groupCode, 'requests'), {
      fromUid: authUser.uid,
      fromName: displayName,
      date: dateStr,
      shiftCode: shift.toUpperCase(),
      note: note || '',
      status: 'open',
      takenBy: null,
      takenByName: null,
      createdAt: FB.serverTimestamp()
    });
  }catch(e){ alert('Invio non riuscito: ' + e.message); }
  onlineBusy = false;
  renderPanelBody();
};

window.acceptSwapRequest = async function(id){
  if(!onlineReady()) return;
  if(!confirm('Confermi di prenderti questo turno?')) return;
  onlineBusy = true; renderPanelBody();
  try{
    const FB = window.FB;
    await FB.updateDoc(FB.doc(FB.db, 'groups', groupCode, 'requests', id), {
      status: 'taken',
      takenBy: authUser.uid,
      takenByName: displayName
    });
  }catch(e){ alert('Operazione non riuscita: ' + e.message); }
  onlineBusy = false;
  renderPanelBody();
};

window.cancelSwapRequest = async function(id){
  if(!onlineReady()) return;
  if(!confirm('Eliminare questa richiesta?')) return;
  try{
    const FB = window.FB;
    await FB.deleteDoc(FB.doc(FB.db, 'groups', groupCode, 'requests', id));
  }catch(e){ alert('Eliminazione non riuscita: ' + e.message); }
  renderPanelBody();
};

function fmtDateIt(iso){
  try{
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${ITALIAN_MONTHS_SHORT[m-1]} ${y}`;
  }catch(e){ return iso; }
}

function renderSwapPanel(){
  if(!window.FB || !window.FB.enabled){
    return `
      <h2>Scambio turni</h2>
      <p style="font-size:0.85rem; color:var(--ink-soft);">
        La parte online non e' ancora configurata. Serve un progetto Firebase gratuito:
        una volta creato, incolla i dati nella sezione in cima al file dell'app.
      </p>`;
  }
  if(!authUser || !authUser.uid){
    return `
      <h2>Scambio turni</h2>
      <p style="font-size:0.85rem; color:var(--ink-soft);">
        Per usare lo scambio turni devi accedere con un account online. Esci e rientra con email e password.
      </p>`;
  }
  if(!groupCode){
    return `
      <h2>Scambio turni</h2>
      <p style="font-size:0.85rem; color:var(--ink-soft);">
        Entra nel gruppo dei tuoi colleghi con un codice condiviso. Chi lo usa per primo lo crea,
        gli altri usano lo stesso codice per unirsi.
      </p>
      <button class="btn-primary" onclick="joinGroup()">Entra in un gruppo</button>`;
  }

  const mine = openRequests.filter(r=>r.fromUid === authUser.uid);
  const others = openRequests.filter(r=>r.fromUid !== authUser.uid);

  const card = (r, isMine)=>`
    <div class="swap-card ${r.status==='taken'?'taken':''}">
      <div class="swap-card-head">
        <span class="swap-shift">${r.shiftCode}</span>
        <span class="swap-date">${fmtDateIt(r.date)}</span>
      </div>
      <div class="swap-meta">${isMine?'la tua richiesta':'da '+(r.fromName||'collega')}</div>
      ${r.note?`<div class="swap-note">"${r.note}"</div>`:''}
      ${r.status==='taken'
        ? `<div class="swap-status">✅ preso da ${r.takenByName||'un collega'}</div>`
        : (isMine
            ? `<button class="mini-btn danger" onclick="cancelSwapRequest('${r.id}')">annulla richiesta</button>`
            : `<button class="btn-primary" style="padding:6px 14px; font-size:0.8rem;" onclick="acceptSwapRequest('${r.id}')">Lo prendo io</button>`)}
    </div>`;

  return `
    <h2>Scambio turni</h2>
    <div class="special-row"><span>Gruppo</span><span>${groupCode}</span></div>
    <div class="special-row"><span>Il tuo nome</span><span>${displayName}</span></div>
    <button class="mini-btn" onclick="joinGroup()">cambia gruppo</button>
    <button class="mini-btn danger" onclick="leaveGroup()">esci dal gruppo</button>

    <div class="section-label">Chiedi che qualcuno prenda un tuo turno</div>
    <div class="pay-row">
      <label>Giorno<input type="date" id="swapDate"></label>
      <label>Turno<input type="text" id="swapShift" placeholder="es. P" maxlength="4"></label>
    </div>
    <div class="pay-row">
      <label>Nota (facoltativa)<input type="text" id="swapNote" placeholder="es. ho una visita"></label>
    </div>
    <button class="btn-primary" onclick="createSwapRequest()" ${onlineBusy?'disabled':''}>
      ${onlineBusy?'Invio...':'Invia richiesta'}
    </button>

    <div class="section-label">Richieste dei colleghi</div>
    ${others.length ? others.map(r=>card(r,false)).join('') : `<div class="calendar-note">nessuna richiesta al momento</div>`}

    <div class="section-label">Le tue richieste</div>
    ${mine.length ? mine.map(r=>card(r,true)).join('') : `<div class="calendar-note">non hai richieste attive</div>`}
  `;
}

(async function init(){
  if(!localStorage.getItem(STORAGE_FIRSTUSE_KEY)){
    localStorage.setItem(STORAGE_FIRSTUSE_KEY, new Date().toISOString());
  }
  migrateLegacyData();
  loadStructures();
  loadCustomColors();
  loadGroup();
  if(window.FB_READY) { try{ await window.FB_READY; }catch(e){} }
  await loadSettings();
  await loadMonth(viewY, viewM);

  // se Firebase e' attivo, allinea lo stato all'utente realmente autenticato
  if(window.FB && window.FB.enabled){
    window.FB.onAuth((u)=>{
      if(u){
        // account online presente: abilita anche lo scambio turni
        authUser = {email:u.email, uid:u.uid};
        try{ localStorage.setItem(STORAGE_AUTH_KEY, JSON.stringify(authUser)); }catch(e){}
        startRequestsListener();
      } else {
        // nessun account online: NON si esce dall'app.
        // Chi usa l'app solo in locale continua a entrare come prima,
        // semplicemente senza la parte di scambio turni.
        if(authUser) authUser = {email: authUser.email};
        stopRequestsListener();
      }
      render();
    });
  }

  render();
  startRequestsListener();
})();
</script>
